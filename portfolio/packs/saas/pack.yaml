# Short label used on the root portfolio page's 3-card preview.
# Keep terse; longer framing lives in the landing hero.

# 2026-04-11 research evidence pass: glossary terms for hover tooltips
# (markup_terms filter in vertical_landing.html).
glossary:
  HubSpot: "A CRM used broadly by mid-market SaaS GTM teams. For PLG companies it tends to hold the paid-seat count and pipeline but lag behind actual product usage."
  BigQuery: "Google's cloud data warehouse. In PLG GTM stacks it's usually the source of truth for product telemetry. The table where HubSpot seat counts disagree with reality."
  Hightouch: "A reverse-ETL product that syncs data from warehouses like BigQuery into operational tools like HubSpot. Jobs can fail silently, which is one of the root causes of the seat-drift scenario."
  Stripe: "Payment + billing platform. For usage-based or seat-based SaaS, the amount invoiced through Stripe is the third source that should agree with HubSpot and BigQuery but often doesn't."
  PLG: "Product-Led Growth. A GTM model where the product itself drives acquisition and expansion, with sales assist layered on top. PLG companies tend to have usage signals that lead revenue by weeks."
  PQL: "Product-Qualified Lead. An account whose in-product behavior crosses a threshold that historically converts. The counterpart to MQL for product-led GTM."
  AE: "Account Executive. The closing sales role that owns opportunities in the pipeline."
  MQL: "Marketing-Qualified Lead. A traditional marketing-sourced lead. In PLG funnels, product signals usually outperform MQL signals for conversion."
  ARR: "Annual Recurring Revenue. The standard SaaS revenue metric for subscription customers."
  "pipeline coverage": "The ratio of open pipeline dollar value to the quarter's remaining quota. Below ~3.0× usually means the quarter is at risk; above means there's enough to weather normal fallout."
  "stage-skipping": "A deal moving from an early pipeline stage directly to late-stage without passing through the intermediate stages. Hides quality problems the standard pipeline view doesn't catch."
  "commission audit": "A RevOps workflow that reconstructs how a deal actually moved through the pipeline and who owned it when, so commission is paid correctly when multiple AEs touched a deal."
  RevOps: "Revenue Operations. The function that owns GTM systems, data, and process. The role this portfolio is aimed at."
  Attio: "A warehouse-native CRM popular with PLG RevOps teams that want product signals inside the CRM rather than syncing through middleware."
  "warehouse-native": "GTM tools built on top of the company's data warehouse (Snowflake / BigQuery / Redshift) instead of maintaining a separate internal database. Reduces sync gaps."
  Hex: "A collaborative notebook tool used by analytics and RevOps teams for ad-hoc data exploration. Often the place a 'debug why this PQL didn't convert' session ends up."

research_sources:
  - title: "Hightouch · reverse ETL for SaaS GTM"
    url: "https://hightouch.com/blog/reverse-etl"
    note: "The tool most commonly used to sync product usage from BigQuery into HubSpot. Its failure mode, jobs that fail silently, is directly responsible for the phantom seats scenario."
  - title: "Attio + Hightouch · product data inside your CRM"
    url: "https://attio.com/blog/attio-hightouch-all-your-user-and-product-data-inside-your-crm"
    note: "Good reference on the 'continuous reconciliation logic upstream in the warehouse' pattern that makes seat drift visible to AEs as a working queue."
  - title: "HubSpot · managing seats and seat billing"
    url: "https://knowledge.hubspot.com/account-management/manage-seats"
    note: "HubSpot's own docs on how seats are recorded on a deal. Useful for understanding why the warehouse vs. CRM drift happens: HubSpot's seat count is manual on deal closure."
  - title: "Stripe · metered billing + usage records"
    url: "https://docs.stripe.com/billing/subscriptions/usage-based"
    note: "The third side of the triangle (CRM / warehouse / billing). Stripe's usage-based billing is where phantom seats turn into unbilled revenue."
  - title: "OpenView · Your guide to Product-Qualified Leads"
    url: "https://openviewpartners.com/blog/your-guide-to-product-qualified-leads-pqls/"
    note: "Practitioner writing on PQL definitions, scoring, and the AE-routing pattern that decays if nobody watches the queue."
  - title: "dbt · incremental models for warehouse-native GTM"
    url: "https://docs.getdbt.com/docs/build/incremental-models"
    note: "The transform layer where pipeline-history tables (Forecast Variance scenario) actually live. The 'store the full history of every stage move' shape is usually built as a dbt incremental model."

