# Scrollytelling landing page config — consumed by templates/vertical_landing.html
# via pack_operations(). Each section's `loader` must exist as a key in
# SECTION_CONTEXT_LOADERS in routes/pack_demo.py. The narrative text is
# copied verbatim from 2026-04-10-opslayer-final-build-plan.md lines 364-492.
landing:
  # Root page 3-card preview uses this. Surfaced as a caption row above the CTA.
  signals: "HubSpot · BigQuery · Stripe · Hightouch"

  hero:
    eyebrow: "PLG B2B SaaS, three operational scenarios"
    # Umbrella framing for the vertical — the shape of operator pain in
    # PLG SaaS GTM that all three scenarios below are specific variations
    # of. Rewritten 2026-04-11 anti-template pass v3 (previous H1 was
    # scenario 1's story, not an umbrella).
    problem: >
      PLG RevOps lives with a CRM that records the state of the pipeline
      and the customer list as of right now. How each deal or account got
      where it is, and what customers are actually doing in the product,
      usually lives in a warehouse or a billing system that isn't the CRM.
    # Short 1-line version for the root tile.
    root_tile_title: >
      The CRM records the current state of the pipeline, but the history
      behind each deal and the product behavior behind each account live
      somewhere else.
    # Rendered on the root launchpad card. Names the three canonical
    # SaaS scenarios inline and calls out the artifact specific to this
    # vertical. Added 2026-04-11 root tile card pass.
    card_preview: >
      Three problems worked: seats in use that nobody is billing, hot
      leads that went cold in a queue nobody watches, and a forecast
      that misses for reasons the pipeline view can't show. Built with
      a real database and a short SQL query that catches seat counts
      drifting from what's billed.
    # hero.thesis dropped.
    intro_paragraph: >
      Phantom seats nobody's billing, PQL signals decaying in a queue
      nobody watches, and forecast variance the standard pipeline view
      can't explain. One worked example for each.
    research_prelude: >
      PLG operations is written about more publicly than most verticals,
      mostly by practitioners at Hightouch, Attio, and warehouse-native
      RevOps teams. These three scenarios come up repeatedly in that
      writing.

  sections:
    - id: phantom_seats
      loader: saas.phantom_seats
      partial: components/packs/saas/phantom_seats.html
      narrative:
        eyebrow: "Scenario 1 of 3"
        title: "The Phantom Seats"
        problem: |
          HubSpot says an account is on an 8-seat plan. The product database
          shows 23 active users in the last 30 days. Sales reps quote upgrade
          conversations against what HubSpot says, missing unbilled revenue.
          This is common at PLG companies where the Hightouch sync quietly
          lags reality.
        solution: |
          The shape I'd start with is a scheduled job that compares HubSpot's
          paid seat count to the warehouse's active-user count each month.
          When they disagree, it records the gap with a dollar figure from
          the contract. That becomes a simple queue an AE can work, raising
          the bill or opening an expansion.
        production_example:
          url: "https://github.com/ryanzegalia/portfolio/blob/main/nexus/components/heartbeat-services.md"
          label: "Nine scheduled reconciliation services with checkpoint sync and circuit breakers"
        code_artifact:
          language: sql
          caption: "The shape of the seat-drift query"
          code: |
            -- one row per account where the billed seats and last-30d
            -- active users disagree. Assumes hubspot_companies and
            -- product_events are landed in the warehouse by a nightly
            -- ETL sync (Fivetran, Airbyte, or similar).
            WITH active_users AS (
              SELECT
                account_id,
                COUNT(DISTINCT user_id) AS active_user_count_30d
              FROM product_events
              WHERE event_ts >= current_date - interval '30 days'
              GROUP BY 1
            )
            SELECT
              h.account_id,
              h.account_name,
              h.billed_seats                               AS hubspot_seats,
              COALESCE(a.active_user_count_30d, 0)         AS warehouse_users,
              GREATEST(COALESCE(a.active_user_count_30d, 0) - h.billed_seats, 0) AS overage_users,
              (GREATEST(COALESCE(a.active_user_count_30d, 0) - h.billed_seats, 0)
                 * h.contract_per_seat_rate)               AS dollar_impact
            FROM hubspot_companies h
            LEFT JOIN active_users a USING (account_id)
            -- <> keeps drift in both directions: overage AND seats billed
            -- with no activity at all (the LEFT JOIN's zero-usage rows)
            WHERE COALESCE(a.active_user_count_30d, 0) <> h.billed_seats
            ORDER BY dollar_impact DESC;
      cta:
        label: "See the full drift table"
        href: /saas/revenue

    - id: stale_pql
      loader: saas.stale_pql
      partial: components/packs/saas/stale_pql.html
      narrative:
        eyebrow: "Scenario 2 of 3"
        title: "The Stale PQL"
        problem: |
          A free user hit a usage threshold 14 days ago. The PQL was scored,
          routed to an AE in HubSpot, and never followed up. The score has
          decayed below threshold, and the signal is now invisible outside a
          weekly Hex notebook review.
        solution: |
          What I'd sketch is a scorer that watches in-product behavior and
          flags accounts on usage patterns that historically convert. If a
          high-scoring account sits untouched in an AE queue for two weeks,
          it resurfaces with the original signals and HubSpot context so the
          AE can re-run the play in one click.
      cta:
        label: "See all 14 decayed PQLs"
        href: /saas/pql

    - id: forecast_variance
      loader: saas.forecast_variance
      partial: components/packs/saas/forecast_variance.html
      narrative:
        eyebrow: "Scenario 3 of 3"
        title: "Forecast Variance"
        problem: |
          End of quarter. The CRO needs forecast confidence. HubSpot shows
          $4.2M committed pipeline, last quarter the team booked $2.9M
          against $4.4M at a 66% close rate, but with stage-skipping the
          standard pipeline view hides. Commission disputes are stacking up
          because deals were re-credited mid-quarter and nobody has an audit
          trail.
        solution: |
          The way I'd approach it is to store the full history of every
          deal's stage moves, not just where it sits right now. That history
          unlocks a real pipeline coverage ratio, catches stage-skips
          HubSpot hides, and builds a clean commission audit you can
          actually defend.
      cta:
        label: "Open the full forecast view"
        href: /saas/forecast