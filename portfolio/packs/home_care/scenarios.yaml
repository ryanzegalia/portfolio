- id: evv_triple_mismatch
  title: "EVV Triple Mismatch"
  vocabulary_subtext: "Sandata vs. WellSky schedule vs. WellSky care plan"
  route: /home-care/reconciliation/evv
  card_text: |
    ┌─ EVV ↔ SCHEDULE ↔ AUTHORIZATION RECONCILIATION ────────────────────────┐
    │  Last 30 days · 1,247 visits checked · 47 mismatches · −$2,340         │
    │                                                                        │
    │  MISMATCH BREAKDOWN                                                    │
    │   • 23 visits - caregiver hours > authorized hours    (−$890)          │
    │   • 18 visits - caregiver hours < scheduled hours     (−$620)          │
    │   •  6 visits - EVV record missing entirely (paper)   (−$830)          │
    │                                                                        │
    │  TOP IMPACT MISMATCH                                                   │
    │  ┌──────────────────────────────────────────────────────────────────┐  │
    │  │ Mrs. Ada Robinson  ·  4/03/26  ·  Caregiver: Yolanda Torres      │  │
    │  │ ┌──────────────┬──────────────┬──────────────┬───────────────┐   │  │
    │  │ │              │ Sandata EVV  │ WellSky      │ WellSky       │   │  │
    │  │ │              │              │ Schedule     │ Care Plan     │   │  │
    │  │ │ Start        │ 8:14am       │ 8:00am       │ 8:00am        │   │  │
    │  │ │ End          │ 12:42pm      │ 12:00pm      │ -             │   │  │
    │  │ │ Hours        │ 4.47         │ 4.00         │ 4.00 max      │   │  │
    │  │ │ Tasks        │ bath, meal,  │ bath, meal   │ bath, meal    │   │  │
    │  │ │              │ + laundry    │              │               │   │  │
    │  │ └──────────────┴──────────────┴──────────────┴───────────────┘   │  │
    │  │                                                                  │  │
    │  │ Drift:   28 minutes over authorization + unauthorized task       │  │
    │  │ Impact:  0.47 hrs over the daily cap                             │  │
    │  │          → blocks $14.10 of the per-diem reimbursement²          │  │
    │  │          + family will dispute the laundry charge                │  │
    │  │                                                                  │  │
    │  │ ² Calculated against this client's John Hancock LTC policy daily │  │
    │  │   cap of $210/day; the 0.47 hr overage maps to ~$14.10 of capped │  │
    │  │   reimbursement on this visit. Per-diem caps apply, not hourly.  │  │
    │  │                                                                  │  │
    │  │ Reconciler Agent:                                                │  │
    │  │ "Yolanda has done 4 prior shifts with Mrs. Ada and laundry has   │  │
    │  │ been added each time without an authorization update. Suggest    │  │
    │  │ requesting an LTC carrier reauth to add 'laundry, 30 min,        │  │
    │  │ 1×/week' to Mrs. Ada's care plan. Draft below."                  │  │
    │  │                                                                  │  │
    │  │ [Accept fix]   [Manual review]   [Generate reauth request]       │  │
    │  └──────────────────────────────────────────────────────────────────┘  │
    │                                                                        │
    │  Note: EVV reporting is required for Medicaid waiver clients under     │
    │  the 21st Century Cures Act, and most agencies voluntarily use the     │
    │  same EVV system for their private-pay clients too - running two       │
    │  EVV systems is operationally infeasible.                              │
    └────────────────────────────────────────────────────────────────────────┘
