stuck_triage_before_after:
  scenario_title: "The 6am Call-Off: manual vs. automated"
  trigger: "06:02 SMS: Maria Lopez out sick"
  before_total_minutes: 22
  before_sms_count: 4
  before_family_notify_minutes_after_calloff: 36
  after_total_minutes: 2
  after_family_notify_minutes_after_calloff: 2
  before_panel: |
    06:02  Maria Lopez SMS: "out sick today, sorry"
    06:03  Scheduler opens WellSky, filters available caregivers
    06:08  Scheduler texts Yolanda: "can you cover Henderson 7-11?"
    06:14  No reply yet. Scheduler texts Crystal as backup.
    06:19  Yolanda replies "yes." Scheduler messages Crystal "nvm, covered."
    06:21  Scheduler updates WellSky shift assignment.
    06:24  Scheduler messages family: "Yolanda will be there at 7."
           Total: 22 minutes of scheduler attention. 4 SMS sent.
           Henderson family notified 36 minutes after the call-off.
  after_panel: |
    06:02  Maria Lopez SMS arrives. Stuck Triage Agent fires.
    06:02  Agent fetches shift, ranks 4 backups, drafts fanout plan.
    06:02  Agent queues SMS to Yolanda (1st), 90s delay to Crystal (2nd),
           90s to Brittany (3rd), 90s to Marcus (4th). First reply wins.
    06:04  Yolanda replies yes. Agent cancels remaining sends.
    06:04  Agent updates WellSky and notifies family.
           Total: 2 minutes wall clock. 0 minutes scheduler attention.
           Henderson family notified 2 minutes after the call-off.

