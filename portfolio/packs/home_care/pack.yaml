id: home-care
name: "Non-Clinical Home Care"
# Plain-English label on the root card — the precise
# "Non-Clinical Private-Pay Home Care" phrasing still shows in the hero
# eyebrow on /home-care itself (see hero.eyebrow below).
vertical_label: "Home Care Agencies"

# 2026-04-11 research evidence pass: glossary terms for hover tooltips.
# Applied via the `markup_terms` Jinja filter to every problem/solution
# paragraph in the vertical landing template. Longest keys match first,
# so "Sandata EVV" is tagged as one unit rather than just "EVV" inside it.
glossary:
  EVV: "Electronic Visit Verification. A GPS + timestamp check that a caregiver was physically at the client's home for their shift. Federally required for Medicaid under the 21st Century Cures Act; voluntarily used by many private-pay agencies to protect against LTC-insurance claim disputes."
  "Sandata EVV": "The most common EVV software. Used by state Medicaid systems in several 'closed model' states as the mandated clock-in app; agencies also deploy it voluntarily alongside WellSky."
  WellSky: "The dominant home care scheduling + care plan software. Agencies use it as their system of record for shifts, client info, and authorized hours."
  Viventium: "A payroll platform focused on home care. Pulls hours from the scheduler and pays caregivers. That's exactly where the EVV-vs-schedule gap turns into a dollar leak."
  Careswitch: "A scheduling + caregiver experience product for home care agencies, with built-in SMS fanout for call-offs."
  AxisCare: "A home care management suite with scheduling, EVV, billing, and a community forum where operators discuss day-to-day pain."
  "LTC insurance": "Long-Term Care insurance. Carriers reimburse home care for policyholders but require a nurse assessment (sent by the carrier, not the agency) to authorize or reauthorize hours."
  "John Hancock LTC": "One of the larger LTC insurance carriers. Used in the scenario as a concrete example of a carrier that requires periodic reauthorization."
  reauth: "Reauthorization. The periodic review an LTC carrier runs to decide whether to keep paying for a client's hours. Assessed by the carrier's nurse, not the agency. Agencies supply documentation; they never draft the reauth itself."
  "fairness rotation": "An informal practice where schedulers spread last-minute backup shifts evenly across caregivers, so the same two people don't get called every morning. Tracked manually, usually breaks within a month."
  "acuity drift": "Shorthand for a client's care needs changing faster than the care plan reflects. Margin-leaks both ways. The agency absorbs un-reimbursed care, or the client gets under-served."
  "care plan": "The authorized list of tasks and hours for a client. Typically stored in WellSky, set during intake and updated at reauthorization."
  Medicaid: "Federally-matched state health insurance for low-income and certain disabled populations. Home care reimbursed by Medicaid is the main path that triggers EVV requirements."
  "private-pay": "Home care paid directly by the client or family (or via LTC insurance) rather than Medicaid. Not subject to the federal EVV mandate. Agencies often still use EVV voluntarily."
  "QuickBooks": "Intuit's small-business accounting software. Used by many agencies for family invoicing, which is where the hours-invoiced-vs-hours-paid gap shows up."

research_sources:
  - title: "CMS · FY 2025 Medicaid improper payments fact sheet"
    url: "https://www.cms.gov/newsroom/fact-sheets/fiscal-year-2025-improper-payments-fact-sheet"
    note: "CMS reports that 77% of FY 2025 Medicaid improper payments came from insufficient documentation. For home care, EVV mismatches and missing visit records sit exactly in that documentation category, which is the underlying pain the EVV reconciliation scenario addresses."
  - title: "AxisCare · scheduling features"
    url: "https://axiscare.com/features/scheduling/"
    note: "Reference point for what existing products already cover on backup-caregiver fanout. Load-bearing for the 'existing products handle some version of this' framing in Scenario 1."
  - title: "Careswitch"
    url: "https://www.careswitch.com/"
    note: "A scheduling product with built-in SMS coverage flows. The other existing-product reference for Scenario 1."
  - title: "LifeWorx · LTC insurance assessment process"
    url: "https://lifeworx.com/services/long-term-care-insurance-assessment/"
    note: "Confirms that the carrier (not the agency) sends a nurse to do the reauthorization assessment. Load-bearing for Scenario 3's role boundary. The single most important sentence on the page hangs on this source."
  - title: "FLTCIP (OPM Federal LTC Insurance) · claims reimbursement rules"
    url: "https://www.ltcfeds.gov/claims-information/reimbursement"
    note: "Federal LTC insurance program's carrier-side documentation rules: agencies supply itemized invoices with dates of service, hours per day, and description of services. The clinical reauth (functional and cognitive assessment) stays with a carrier-coordinated nurse. Complements the LifeWorx role-boundary citation above."
  - title: "Ankota · state-by-state EVV rules and mandated vendors"
    url: "https://www.ankota.com/evv-state-by-state"
    note: "The most widespread EVV software is Sandata, mandated as the closed-model clock-in tool in several states (CT, IL, RI, TN). This page names the states and their EVV vendor choices."
  - title: "CMS · Electronic Visit Verification"
    url: "https://www.medicaid.gov/medicaid/home-community-based-services/guidance/electronic-visit-verification-evv/index.html"
    note: "The federal EVV requirement originated in the 21st Century Cures Act and is administered by CMS for Medicaid-funded personal care and home health services."

