# -- Scenario 2: The Compliance Event Trigger --
# External events that create time-sensitive buying windows.
# Each trigger has a type, days_since (for decay calc), and routing.
compliance_triggers:
  active_trigger_count: 6
  hero_triggers:
    - company: "Tessera Health"
      event_type: "m_and_a"
      event_label: "Acquired by Palantir Health Systems"
      event_detail: "Announced 12 days ago. Acquirer requires SBOM audit of all target company software assets before close."
      days_since: 12
      decay_score: 0.87
      composite_score: 92
      routing: "named_ae"
      assigned_ae: "Jordan Reeves"
    - company: "Cloudspan"
      event_type: "cra_deadline"
      event_label: "EU CRA vulnerability reporting deadline"
      event_detail: "Sells SaaS product to EU customers. September 2026 vulnerability reporting requirement is 5 months out."
      days_since: 0
      months_to_deadline: 5
      decay_score: 0.58
      composite_score: 88
      routing: "named_ae"
      assigned_ae: "Alyssa Chen"
    - company: "NexGen Payments"
      event_type: "pci_dss"
      event_label: "PCI DSS 4.0 audit due"
      event_detail: "Payment processor. Requirement 6.3.2 component inventory audit scheduled for Q3. Currently no SBOM tooling in place."
      days_since: 0
      months_to_deadline: 3
      decay_score: 0.33
      composite_score: 85
      routing: "named_ae"
      assigned_ae: "Alyssa Chen"
    - company: "Beacon Platform"
      event_type: "job_signal"
      event_label: "Hiring SBOM Program Manager"
      event_detail: "Posted 8 days ago on LinkedIn. Job description references SPDX, CycloneDX, and federal attestation requirements."
      days_since: 8
      decay_score: 0.91
      composite_score: 74
      routing: "bdr_queue"
      assigned_ae: null
    - company: "Stratos Software"
      event_type: "m_and_a"
      event_label: "Series D from Vista Equity"
      event_detail: "Announced 34 days ago. Vista typically requires open-source license audits within first 90 days of investment."
      days_since: 34
      decay_score: 0.62
      composite_score: 68
      routing: "bdr_queue"
      assigned_ae: null
    - company: "Ridgeline Systems"
      event_type: "ai_code_adoption"
