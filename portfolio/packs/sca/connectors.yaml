- source_key: salesforce
  mappings:
    canonical_name: opportunity.account.name
    deal_stage: opportunity.stage_name
    deal_amount: opportunity.amount
  reconciliation_rules:
    canonical_name: salesforce
    deal_stage: salesforce

- source_key: github
  mappings:
    repo_count_total: org.public_repos
