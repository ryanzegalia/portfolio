id: sca
name: "Software Supply Chain Compliance"
vertical_label: "Software Supply Chain Compliance"

glossary:
  SCA: "Software Composition Analysis, tools that scan codebases for open-source dependencies, detect licenses, and flag vulnerabilities."
  SBOM: "Software Bill of Materials, a structured inventory of every component in a software product. Increasingly required by regulation."
  copyleft: "License type (GPL, AGPL) requiring derivative works to carry the same license. The compliance exposure that drives legal team involvement in SCA evaluations."
  SPDX: "Standard SBOM format maintained by the Linux Foundation. One of two common interchange formats alongside CycloneDX."
  CycloneDX: "OWASP's SBOM format, common in security-focused toolchains."
  false positive: "A scan result flagging a dependency as vulnerable or non-compliant when it is not. The metric engineering teams weight most heavily during proof-of-concept evaluations."
  CRA: "EU Cyber Resilience Act, requires SBOM disclosure for products with digital elements sold in the EU. Full enforcement December 2027."
  PCI DSS: "Payment Card Industry Data Security Standard. Version 4.0, mandatory March 2025, requires software component inventory for anyone processing card payments."
  net dollar retention: "Revenue from existing customers this year divided by last year. Top SCA companies reported above 130% during their high-growth phase; mature portfolios tend to settle lower."
  POC: "Proof of concept, the 2-4 week evaluation period where engineering scans a representative repo set before committing to a vendor."
  reverse-ETL: "Tools like Hightouch that sync warehouse data back into operational systems like the CRM."

