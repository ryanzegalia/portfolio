id: distribution
name: "Wholesale Distribution Technology"
vertical_label: "Wholesale Distribution Technology"

glossary:
  ERP: "Enterprise Resource Planning, the core transactional system a distributor runs on. Determines every technology integration path."
  Prophet 21: "Epicor's distribution-specific ERP, widely adopted in mid-market electrical, plumbing, and HVAC distribution."
  Epicor: "Major ERP vendor for distribution. Parent of Prophet 21 and Eclipse product lines."
  POV: "Proof of Value, a trial period where the distributor tests automation on their own orders before committing to a contract."
  inside sales: "Order desk reps who process incoming orders by phone, email, and fax. The role AI order entry automates."
  FTE: "Full-time equivalent. The headcount savings metric distributors think in. A distributor operating on 3% net margin needs every dollar of software justified against direct labor cost."
  hit rate: "Share of a customer's total spend that a distributor captures vs. loses to competitors. Sometimes called share of wallet. The metric branch managers care about most."
  roll-up: "PE strategy of acquiring multiple companies in the same vertical and consolidating operations. Creates sequential buying windows for tech vendors."
  PVF: "Pipe, valves, and fittings, a major distribution sub-vertical with its own trade shows, associations, and buyer personas."
  MRO: "Maintenance, repair, and operations supply, another distribution sub-vertical often with higher margins than commodity distribution."
  technographic: "Data about a company's installed technology stack, sourced from providers like 6sense, job postings, and vendor directories."

