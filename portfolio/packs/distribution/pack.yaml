    intro_paragraph: >
      Knowing which ERP a prospect runs before the first call, quantifying
      trial outcomes so the business case writes itself, and catching the
      100-day window after a PE acquisition before a competitor does. One
      worked example for each.
    research_prelude: >
      Wholesale distribution is an industry that runs on relationships,
      institutional knowledge, and ERP systems that predate the smartphone.
      The practitioner writing from Proton.ai and Distribution Strategy Group
      covers the sales challenges, and the PE deal flow data from Supply
      House Times tells the acquisition story. The GTM operational problems
