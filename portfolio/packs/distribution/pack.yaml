  sections:
    - id: erp_detection
      loader: distribution.erp_detection
      partial: components/packs/distribution/erp_detection.html
      narrative:
        eyebrow: "Scenario 1 of 3"
        title: "The ERP Detection Problem"
        problem: |
          Before a sales team can demo to a distributor, they need to know
          which ERP the prospect runs. The ERP determines the integration
          path, the demo environment, and whether setup takes an hour or three
          months. Distributors do not advertise their ERP on their website.
          Most sales teams handle this manually, with an SDR spending 15
          minutes per prospect on LinkedIn and Google before making a call.
        solution: |
          What I'd prototype is an enrichment layer that scores ERP confidence
          from four signal sources: job postings mentioning "Prophet 21
          administrator," vendor partner directories, trade show exhibitor
          lists, and technographic providers like 6sense. Each source
          contributes a weighted score. High-confidence matches route to the
          right demo track; prospects with no signals get flagged for manual
          qualification instead of wasting an AE's call.
        production_example:
          url: "https://github.com/ryanzegalia/portfolio/blob/main/jobradar/src/keyword_scorer.py"
          label: "528-line weighted multi-factor scoring engine with section-based evidence accumulation"
        code_artifact:
          language: python
          caption: "The shape of the ERP confidence scorer"
          code: |
            def score_erp_confidence(
                prospect_id: str, signals: dict
            ) -> dict:
                """Score ERP confidence from enrichment signals.

                Each signal source contributes independently.
                A single strong signal (job posting naming the
                ERP) is enough to route; multiple weak signals
                accumulate to medium confidence.
                """
                weights = {
                    "job_posting_keyword":  0.45,
                    "vendor_directory":     0.30,
                    "trade_show_exhibitor": 0.15,
                    "technographic_match":  0.10,
                }

                erp_scores: dict[str, float] = {}
                for signal_type, matches in signals.items():
                    w = weights.get(signal_type, 0.05)
                    for erp_name, strength in matches.items():
                        erp_scores[erp_name] = (
                            erp_scores.get(erp_name, 0)
                            + w * strength
                        )

                if not erp_scores:
                    return {
                        "erp": None,
                        "confidence": 0,
                        "route": "manual_qualification",
                    }

                best = max(erp_scores, key=erp_scores.get)
                conf = min(erp_scores[best], 1.0)
                return {
                    "prospect_id": prospect_id,
                    "erp": best,
                    "confidence": round(conf, 2),
                    "route": (
                        "demo_track" if conf >= 0.6
                        else "manual_qualification"
                    ),
                }
      cta:
        label: "See the full enrichment view"
        href: /distribution/erp-detection

    - id: pov_pipeline
      loader: distribution.pov_pipeline
      partial: components/packs/distribution/pov_pipeline.html
      narrative:
        eyebrow: "Scenario 2 of 3"
        title: "The Proof-of-Value Pipeline"
        problem: |
          A distributor agreed to a two-week proof-of-value trial on a subset
          of incoming orders. The trial is processing 200 orders a day at 94%
          accuracy with 3.1 FTE-equivalent time savings. But this data lives
          in product telemetry, not in HubSpot. The AE's deal record shows
          "POV In Progress" with no quantified outcome attached. When the trial
          ends, the business case is assembled manually from three disconnected
          sources.
        solution: |
          The first thing I'd try is a sync that writes POV outcomes directly
          to the HubSpot deal record as the trial runs: daily accuracy, orders
          processed, time saved, error rate against the manual baseline. When
          the trial crosses go/no-go thresholds, the deal auto-advances with a
          pre-built business case. Trials that stall get flagged for SE
          intervention on the specific underperforming metric.
      cta:
        label: "See the trial dashboard"
        href: /distribution/pov

    - id: pe_trigger
      loader: distribution.pe_trigger
      partial: components/packs/distribution/pe_triggers.html
      narrative:
        eyebrow: "Scenario 3 of 3"
        title: "The PE Trigger Window"
        problem: |
          A private equity firm acquired a regional plumbing distributor last
          month. Within the first 100 days, the PE operating team will audit
          technology adoption and push for automation. This is the
          highest-intent buying window in distribution, but the acquisition was
          announced on Business Wire and covered by Supply House Times. By the
          time a BDR notices on LinkedIn, the 100-day window is half over and
          a competitor is already in conversations.
        solution: |
          My sketch is a trigger monitor that watches PE deal flow from
          Crunchbase, PitchBook, and industry publications. Each acquisition
          gets scored on recency (hottest in the first 30 days, cold by 90),
          PE firm profile (roll-up thesis in distribution scores higher than
          generalist), and target company fit by revenue band and sub-vertical.
          High-scoring triggers route to a named AE with the acquisition
          context.
      cta:
        label: "See the acquisition feed"
        href: /distribution/pe-triggers
