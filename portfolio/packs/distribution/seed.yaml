# -- Scenario 2: The Proof-of-Value Pipeline --
# Active trials with real-time metrics.
pov_pipeline:
  active_pov_count: 3
  hero_trials:
    - company: "Granite State Plumbing Supply"
      deal_stage: "POV"
      deal_amount: 96000
      assigned_ae: "Samantha Voss"
      trial_start: "2026-03-28"
      trial_end: "2026-04-11"
      trial_days_remaining: 0
      thresholds:
        accuracy: 0.90
        orders_per_day: 100
        fte_savings: 2.0
        error_rate: 0.05
      metrics:
        accuracy: 0.94
        accuracy_trend: "stable"
        orders_per_day: 218
        fte_savings: 3.1
        error_rate: 0.028
        error_rate_baseline: 0.072
      status: "above_threshold"
      verdict: "All metrics above go threshold. Business case: 3.1 FTE savings at $42K/FTE = $130K annual savings against $96K contract."
    - company: "Heartland HVAC Parts"
      deal_stage: "POV"
      deal_amount: 142000
      assigned_ae: "Derek Hollis"
      trial_start: "2026-04-01"
      trial_end: "2026-04-15"
      trial_days_remaining: 4
      thresholds:
        accuracy: 0.90
        orders_per_day: 150
        fte_savings: 2.5
        error_rate: 0.05
      metrics:
        accuracy: 0.87
        accuracy_trend: "improving"
        orders_per_day: 164
        fte_savings: 2.2
        error_rate: 0.061
        error_rate_baseline: 0.089
      status: "below_threshold"
      flagged_metric: "accuracy"
      verdict: "Accuracy at 87% (threshold 90%). Error rate trending down. SE intervention recommended: review misclassified SKU categories."
    - company: "Mountain West Industrial"
      deal_stage: "POV"
      deal_amount: 210000
      assigned_ae: "Carlos Ruiz"
      trial_start: "2026-04-05"
      trial_end: "2026-04-19"
      trial_days_remaining: 8
      thresholds:
        accuracy: 0.90
        orders_per_day: 200
        fte_savings: 3.0
        error_rate: 0.05
      metrics:
        accuracy: 0.91
        accuracy_trend: "stable"
        orders_per_day: 187
        fte_savings: 2.8
        error_rate: 0.043
        error_rate_baseline: 0.095
      status: "mixed"
      flagged_metric: "orders_per_day"
      verdict: "Accuracy and error rate above threshold. Orders/day at 94% of target (187/200). Monitor adoption rate at the Denver branch."

