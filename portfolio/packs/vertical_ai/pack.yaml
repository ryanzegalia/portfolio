# Scrollytelling landing page config — consumed by templates/vertical_landing.html
# Verbatim narrative text from 2026-04-10-opslayer-final-build-plan.md lines 671-828.
landing:
  signals: "ZoomInfo · Apollo · LinkedIn · FL Sunbiz"

  hero:
    eyebrow: "Dental DSO vendor GTM, three operational scenarios"
    # Umbrella framing for the vertical — the shape of operator pain in
    # vertical AI GTM that all three scenarios below are specific
    # variations of. Rewritten 2026-04-11 anti-template pass v3 (previous
    # H1 was scenario 1's story, not an umbrella).
    problem: >
      In vertical AI GTM, the data a sales team actually needs about a
      prospect or customer (who the parent company is, which software runs
      the practice, how well the product is working at each of their
      locations) usually isn't in any standard B2B contact database. It
      has to be reconstructed from state filings, job postings, and
      customer telemetry.
    # Short 1-line version for the root tile.
    root_tile_title: >
      The facts you need about a dental group, who owns it and what software
      each office runs, aren't in any contact list you can buy.
    # Rendered on the root launchpad card. Names the three canonical
    # vertical AI scenarios inline and calls out the artifact specific to
    # this vertical. Added 2026-04-11 root tile card pass.
    card_preview: >
      Three problems worked: which offices belong to which parent
      company, which software each practice actually runs, and what
      the product returns location by location. Built with a real
      database and a Python function that checks sources one at a
      time until one answers.
    # hero.thesis dropped.
    intro_paragraph: >
      Account hierarchies where the parent matters more than the contact,
      practice management systems nobody will tell you about until after
      the demo, and per-location ROI buried inside customer Dentrix
      instances. One worked example for each.
    research_prelude: >
      Vertical-AI GTM is new enough that most operational reality lives
      inside sales teams, not in public writing. Dental DSOs are the
      concrete example below because the public record is unusually
      accessible: state corporation filings, trade-press acquisition
      coverage, and active practitioner communities.

  sections:
    - id: account_hierarchy
      loader: vertical_ai.hierarchy
      partial: components/packs/vertical_ai/account_hierarchy.html
      narrative:
        eyebrow: "Scenario 1 of 3"
        title: "The Account Hierarchy Resolver"
        problem: |
          A 500-lead tradeshow list. ZoomInfo says one practice is
          independent, Apollo says it's DSO-owned, LinkedIn says the office
          manager just changed jobs. Florida Sunbiz says it was acquired
          four months ago by Heartland Dental. A cold email to that
          practice gets forwarded to Heartland procurement, turning a
          30-day SMB sale into a 9-month enterprise negotiation.
        solution: |
          What I'd sketch is an enrichment waterfall that runs each prospect
          through ZoomInfo, Apollo, LinkedIn, and a website scrape. When
          the sources disagree, an LLM reads them together with Florida
          Sunbiz corporate filings and produces a confidence-scored verdict
          on the parent company. Not a decision. A routing recommendation
          the rep gets before the first email.
        code_artifact:
          language: python
          caption: "The shape of the enrichment waterfall"
          code: |
            def resolve_parent(practice: Practice) -> ParentVerdict:
                """Reconcile ZoomInfo / Apollo / LinkedIn / Sunbiz / web
                scrape into a confidence-scored DSO-parent verdict.

                When no source has an opinion, returns a verdict with
                parent=None and confidence 0.0, so the caller can decide
                whether to skip the practice or route it as
                'independent, low confidence'.
                """
                sources: list[SourceSignal | None] = [
                    zoominfo.lookup(practice),
                    apollo.lookup(practice),
                    linkedin.office_manager_history(practice),
                    web_scrape(practice.website).detect_dso_footer(),
                    sunbiz.corporate_filings(practice.legal_name),
                ]

                # Drop sources that didn't return anything actionable
                signals = [s for s in sources if s is not None]
                if not signals:
                    return ParentVerdict(parent=None, confidence=0.0,
                                         signals=[], warm_path=[])

                # LLM arbitrates the disagreement, anchored on Sunbiz as
                # the ground-truth legal filing when present
                verdict = llm_synthesize(
                    task="identify_dso_parent",
                    prospect=practice,
                    signals=signals,
                    anchor="sunbiz",
                )

                return ParentVerdict(
                    parent=verdict.parent_company,
                    confidence=verdict.confidence,
                    signals=signals,
                    warm_path=hubspot.contacts_at(verdict.parent_company),
                )
      cta:
        label: "Walk through one resolved practice"
        href: /vertical-ai/enrichment

    - id: sor_detection
      loader: vertical_ai.sor_detection
      partial: components/packs/vertical_ai/sor_detection.html
      narrative:
        eyebrow: "Scenario 2 of 3"
        title: "System-of-Record Detection"
        problem: |
          A vertical AI vendor integrates with whatever dental PMS the
          practice runs (Dentrix, Eaglesoft, Open Dental, Curve, Denticon).
          Each is a different code path, and demoing the wrong one tanks
          the deal. Reps cold-call to ask, which kills outbound velocity.
          Apollo and ZoomInfo don't track it.
        solution: |
          The honest answer is that bigger tools solve this by integrating
          directly with every PMS instead of detecting from the outside.
          My sketch is the detection angle: aggregate Indeed job postings
          asking for specific PMS experience, vendor case study mentions,
          and website source code into a confidence score. It's a
          prototype, not a finished tool. The point is the approach when
          you can't buy the data cleanly.
      cta:
        label: "Walk through one detected PMS"
        href: /vertical-ai/enrichment/sor-detection

    - id: per_location_roi
      loader: vertical_ai.per_location_roi
      partial: components/packs/vertical_ai/per_location_roi.html
      narrative:
        eyebrow: "Scenario 3 of 3"
        title: "Per-Location ROI"
        problem: |
          A 12-location dental group on a $180K/year contract. At 6 months,
          renewal turns on proving case acceptance went up at each location.
          That data lives in 12 separate Dentrix instances. Today the
          vendor argues on vibes, the operator counters with a finance
          director's spreadsheet that says "we don't see the lift," and
          renewals slip.
        solution: |
          The first thing I'd try is a per-location lift calculator: for
          each location, pull product telemetry and pull case acceptance
          from that location's Dentrix instance. Calculate the lift against
          the pre-deployment baseline, flag flat or sync-broken locations,
          and roll it up to a group-level number a CSM can take into the
          QBR.
      cta:
        label: "See the full Health River profile"
        href: /vertical-ai/customers