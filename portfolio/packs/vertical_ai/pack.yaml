vertical_label: "Vertical AI GTM (dental example)"

# 2026-04-11 research evidence pass: glossary terms for hover tooltips.
glossary:
  DSO: "Dental Support Organization. A private-equity-backed company that owns or contracts with a group of dental practices. DSO consolidation in dental is fast: 200+ new affiliations in 2024 alone."
  "Heartland Dental": "The largest DSO in the US, owned by KKR, ~1,650 practices. Used in the scenario as a concrete example of the acquisition events that stale CRMs miss."
  "Aspen Dental": "A top-5 DSO by practice count. Example of the PE-owned dental networks that change ownership records without telling vendors."
  ZoomInfo: "A B2B contact database sold as the default prospecting data layer for most sales teams. Known to lag on DSO ownership changes."
  Apollo: "A B2B contact database that competes with ZoomInfo. Has different ownership info, which is why a waterfall reconciliation across both plus state filings can be better than either alone."
  LinkedIn: "The professional-network graph. Used in the scenario as a third enrichment source for office-manager changes that precede DSO acquisitions."
  "FL Sunbiz": "Florida Division of Corporations public filings database. Free, structured record of corporate ownership changes and Articles of Merger. The anchor source for reconciling DSO-vs-independent claims."
  "Articles of Merger": "A corporate filing that records one entity merging into another. Public record in most US states, including Florida's Sunbiz. Shows the exact date of an acquisition."
  PMS: "Practice Management System. The software a dental office runs at the front desk and back office. Scheduling, charting, billing, insurance. The product a vertical AI vendor has to integrate with."
  Dentrix: "The market-leading dental PMS, owned by Henry Schein. Installed base of thousands of practices; the integration a vertical AI vendor wants to hit first."
  Eaglesoft: "Patterson Dental's PMS product. The second-largest dental PMS after Dentrix."
  "Open Dental": "An open-source-flavored dental PMS, popular with independent practices and smaller DSOs."
  Curve: "A cloud-native dental PMS competing with Dentrix and Eaglesoft. Modern web interface; growing share among new practices."
  Denticon: "A Planet DDS dental PMS used by many DSOs for its multi-location capabilities."
  Carestream: "A dental imaging + PMS vendor whose PMS product runs in a subset of practices."
  "Henry Schein": "The parent company of Dentrix and a dominant dental supply distributor. The gatekeeper for Dentrix integrations and customer lists."
  "Practice Management System": "Full form of PMS. The software a dental office runs at the front desk and back office."
  "system of record": "The one database a team considers authoritative for a given domain. 'The WellSky schedule is the system of record for hours' means any conflict is resolved by trusting WellSky."
  "enrichment waterfall": "A pattern where each prospect is run through a sequence of data sources (CRM → 3rd-party database → scrape → public filings → LLM synthesis), each one filling in what the previous sources couldn't."
  DSOs: "Dental Support Organizations. Plural form of DSO."
  QBR: "Quarterly Business Review. The recurring meeting where a customer and vendor review the quarter's usage, results, and next steps. The main forum for defending a renewal."
  CSM: "Customer Success Manager. The post-sale role that owns customer retention and usage."
  "per-location ROI": "For multi-location customers (e.g. DSOs), the financial impact of the vendor's product measured at each individual location rather than rolled up to the group. The unit a CSM needs to win a renewal conversation."
  "multi-location customer": "A customer that operates multiple distinct locations (e.g. a DSO with 40 practices). Common in dental, veterinary, home services, and franchise verticals."
  "cold email": "Outbound sales email sent to a prospect who hasn't raised their hand. In a consolidated market, cold email to an acquired practice often gets forwarded to the DSO's procurement."
  "SMB sale": "A sales cycle to a small or mid-size business customer. Typically shorter, single decision-maker, monthly contract."
  "enterprise negotiation": "A sales cycle to an enterprise customer. Typically 6+ months, multiple stakeholders, procurement + legal + security review."
  "case acceptance": "In dental, the percentage of treatment plans that patients agree to proceed with. A KPI many dental AI vendors claim to move, so it's the renewal conversation."

research_sources:
  - title: "Becker's Dental · 200+ DSO affiliations in 2024"
    url: "https://www.beckersdental.com/dso-dpms/200-dso-affiliations-in-2024-state-by-state-breakdown/"
    note: "The trade publication tracking DSO consolidation. Where the 'the parent company changes and your CRM doesn't know' pattern gets reported quarterly. Anchor for the Account Hierarchy scenario."
  - title: "Florida Division of Corporations · Sunbiz search"
    url: "https://search.sunbiz.org/Inquiry/CorporationSearch/ByName"
    note: "The free, public state corporation filings database. The ground truth for DSO ownership changes. Anything filed as Articles of Merger is discoverable here before ZoomInfo or Apollo catch it."
  - title: "Heartland Dental · practice locator"
    url: "https://www.heartland.com/"
    note: "The largest DSO in the US. Used as the concrete example for the Account Hierarchy scenario because acquisitions are publicly disclosed and Sunbiz records are cleanly structured."
  - title: "Henry Schein One · Dentrix"
    url: "https://www.henryscheinone.com/products/dentrix/"
    note: "The market-leading dental PMS. The reason the System-of-Record Detection scenario is a real pain: Henry Schein doesn't publish customer lists, and a vertical AI vendor has to reconstruct PMS coverage from public signals."
  - title: "Patterson Dental · Eaglesoft"
    url: "https://www.pattersondental.com/cp/software/dental-practice-management-software/eaglesoft"
    note: "The second dental PMS, same gatekeeper pattern as Dentrix. Vendors competing with Henry Schein's data moat have to scrape detection, not buy a list."
  - title: "Practice Analytics · multi-PMS integrations"
    url: "https://practiceanalytics.com/integrations/"
    note: "The honest alternative to PMS detection: bigger tools just integrate directly with every PMS instead of trying to detect from outside. Referenced in SOR Detection scenario as the 'existing tools handle this differently' framing."

