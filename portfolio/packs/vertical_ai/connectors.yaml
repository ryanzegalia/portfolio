- source_key: hubspot
  mappings:
    canonical_name: properties.name
    practice_size_employees: properties.num_employees
    state: properties.state
    parent_dso_id: properties.parent_account_id
    account_owner_team: properties.owner_team
  reconciliation_rules:
    canonical_name: hubspot
    parent_dso_id: hubspot
    account_owner_team: hubspot

- source_key: apollo
  mappings:
    practice_size_employees: organization.estimated_num_employees
    parent_company: organization.parent_organization_name
  reconciliation_rules:
    parent_company: apollo

- source_key: zoominfo
  mappings:
    practice_size_employees: company.employee_count
    parent_company: company.ultimate_parent_company
  reconciliation_rules: {}

- source_key: linkedin
